
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-commerce-clone
  labels:
    app: e-commerce-clone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: e-commerce-clone
  template:
    metadata:
      labels:
        app: e-commerce-clone
    spec:
      containers:
      - name: e-commerce-clone
        image: manish2302/e-commerce-clone:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
